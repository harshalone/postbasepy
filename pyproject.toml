[project]
name = "postbasepy"
version = "0.1.1"
description = "The official Python client for Postbase — self-hosted backend as a service"
readme = "README.md"
authors = [
    { name = "Postbase", email = "harshalone@gmail.com" }
]
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["postbase", "database", "auth", "storage", "backend", "self-hosted", "postgresql", "baas"]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://www.getpostbase.com"
Repository = "https://github.com/harshalone/postbasepy"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP035", "UP045", "UP007"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
